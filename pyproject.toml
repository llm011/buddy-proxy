[project]
name = "buddy-proxy"
version = "2.0.14"
description = "Local OpenAI/Responses/Anthropic compatible proxy for CodeBuddy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx[socks]>=0.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
buddy-proxy = "buddy_proxy.__main__:main"
trae-cli = "buddy_proxy.trae_provider:_cli"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# static/* 整目录带上：UI 拆分后除 index.html 还有 css/js，别只挑 html
"buddy_proxy.web" = ["models_config.json", "static/*"]
# 随包的 per-account 覆盖表/静态目录，漏带会在 wheel 安装下静默退回兜底
"buddy_proxy.qoder" = ["models.json"]
"buddy_proxy.kimi" = ["models.json"]
# copilot 的静态兜底目录：漏带会让冷启动/离线时 /v1/models 全空
"buddy_proxy.copilot" = ["catalog_fallback.json"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.12.0",
    # uv.lock 不进 git，CI 每次 uv sync 现场解析；tomli 2.5.0 只发 cp311+ wheel，
    # py3.10 job 会装不上（pytest 在 py<3.11 才拉 tomli），按 marker 压住上界
    "tomli>=2,<2.5 ; python_full_version < '3.11'",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 先阻断语法错误和未定义名称；其余历史 lint 债务后续逐步收紧。
select = ["E9", "F821"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
