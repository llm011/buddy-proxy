name: Release

# 每次 push 到 main 自动发一个新版本：patch 位 +1，回提交 pyproject.toml，
# 打 v<版本> 标签并生成 Release Notes。
#
# 大版本/小版本由人决定：直接改 pyproject.toml 的 version（或本地跑
# `uv version --bump minor`）后合进 main 即可，本工作流只负责在人工设的
# 版本之上继续递增 patch。
on:
  push:
    branches: [main]

# 需要写回提交 + 打标签，所以 contents 必须是 write。
permissions:
  contents: write

# 避免两次快速合并各跑一遍、互相覆盖：同一分支只保留最新一个，
# 且不取消正在跑的（取消可能留下「版本已 bump 但没 push」的中间态）。
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # 自动升版提交本身也会触发 push 事件。用提交信息前缀挡住，否则会无限循环。
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          # 用内置 token 推回本仓库，无需额外 secret
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: 配置提交身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 判断是否需要发版
        id: guard
        run: |
          set -euo pipefail
          cur="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "current=$cur" >> "$GITHUB_OUTPUT"
          # 只在「**当前这个提交**已经被打过 v<cur> 标签」时跳过。
          #
          # 不能用「v<cur> 这个标签是否存在」来判断：自动发版完成后，main 上
          # pyproject 已经是 2.0.5 且 tag v2.0.5 也存在；下一次合并进来时
          # pyproject 仍是 2.0.5、tag 仍在——于是永远 skip，版本号从此卡死。
          # 实测 v2.0.5 之后就是这个状态。
          #
          # 按 HEAD 判断则正好：自动发版提交本身已被上面的 job `if` 挡掉；
          # 人工改版本号并打了 tag 的提交也是 HEAD 带 tag，跳过不重复发；
          # 而任何**新的合并提交**都不带 tag，于是正常 bump。
          if git tag --points-at HEAD | grep -qx "v$cur"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "当前提交已打 v$cur 标签，跳过自动升版"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 升版并提交
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # uv version 同时改 pyproject.toml 并同步 uv.lock，比手写 sed 可靠
          uv version --bump patch
          new="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          # **只提交 pyproject.toml**：本仓库的 .gitignore 忽略了 uv.lock
          # （按平台解析的产物，不入库），`git add uv.lock` 会直接报
          # 「paths are ignored」并让整个 job 失败——实测 v2.0.5 就是这么
          # 发版失败的（uv version 本身仍会顺带改写本地 uv.lock，无妨）。
          git add -- pyproject.toml
          git commit -m "chore(release): v$new"

          # 两次合并靠得很近时，checkout 之后远端可能已经前进（另一个 release
          # 跑完并推了它的 chore(release) 提交），直接 push 会被拒。这里 rebase
          # 到最新远端再推，最多重试 5 次。
          #
          # 冲突时**放弃本次发版**而不是硬来：pyproject 的 version 行两边都改了，
          # rebase 必然冲突。下一次 push 会重新触发本工作流，那时起点已是最新，
          # 版本号自然接上——比在 CI 里猜该保留哪个版本号安全。
          #
          # 标签必须在 push **成功之后**才打：rebase 会重写提交 sha，先打的标签
          # 会指向被丢弃的旧提交，指向的 commit 根本不在 main 上。
          for i in 1 2 3 4 5; do
            git fetch origin main --quiet
            if git push origin HEAD:main 2>/dev/null; then
              git tag "v$new"
              git push origin "v$new"
              echo "pushed v$new (attempt $i)"
              exit 0
            fi
            echo "push 被拒，rebase 到最新 main 后重试（第 $i 次）"
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::rebase 冲突，放弃本次自动发版，等下一次 push 重新触发"
              exit 0
            fi
          done
          echo "::error::连续 5 次推送失败，本次未发版"
          exit 1

      - name: 生成 Release Notes
        # 发版（bump + push + tag）已经在上一步完成，这一步失败不该把整次发版
        # 判成失败——实测就因为这个把 v2.0.5 报成红叉，而版本其实已经发出去了。
        continue-on-error: true
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          new="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          prev="$(git describe --tags --abbrev=0 "v$new^" 2>/dev/null || true)"
          range="${prev:+$prev..}v$new"
          # 标题按「提交 → 分类」整理成几点，别把几十条 commit 原样贴上去。
          #
          # **先落到变量再写文件**，不要 `git log | ... | head -40 > file`：
          # head 读够就关闭管道，上游 sed/grep 收到 SIGPIPE 后以非 0 退出，
          # 在 `set -euo pipefail` 下整个步骤直接失败（实测报
          # 「grep: write error: Broken pipe」+ exit code 2）。提交数本来就不多，
          # 一次性取回再截断即可。
          commits="$(git log --no-merges --pretty=format:'%s' "$range" \
            | sed -E 's/^(feat|fix|perf|refactor|docs|test|chore|style|build|ci)(\([^)]*\))?: /\1: /' \
            | grep -v '^chore(release)' || true)"
          {
            echo "## v$new"
            echo
            # 用 sed -n '1,40p' 而不是 head -40：sed 会读完输入，不会因为
            # 提前关闭管道让上游吃 SIGPIPE。
            printf '%s\n' "$commits" | sed -n '1,40p' | sed 's/^/- /'
          } > /tmp/notes.md
          gh release create "v$new" --title "v$new" --notes-file /tmp/notes.md
